.btn.secondary{background:#6c757d;}

.option:active{background:#ececf0;}

.result-img{width:140px;height:140px;margin:20px auto;border-radius:12px;background:#eee;display:flex;align-items:center;justify-content:center;font-size:60px;}

.result-subtitle{color:#777;margin-bottom:24px;}
.result-desc{text-align:left;line-height:1.7;color:#444;margin-bottom:24px;}
.tags-wrap{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px;justify-content:center;}
.tag{background:#f0f0f4;padding:6px 12px;border-radius:20px;font-size:13px;color:#444;}
.canvas-box{margin:16px 0}
#shareCanvas{border-radius:12px;max-width:100%;box-shadow:0 2px 10px #00000015}
.hide{display:none !important;}

let currentQ = 0;
let score = {E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};

function showPage(pageName){
    startPage.style.display = "none";
    quizPage.style.display = "none";
    resultPage.style.display = "none";
    if(pageName === "start") startPage.style.display = "block";
    if(pageName === "quiz") quizPage.style.display = "block";
    if(pageName === "result") resultPage.style.display = "block";
}

function renderQuestion(){
    const q = questions[currentQ];
    totalNumEl.innerText = questions.length;
    currentNumEl.innerText = currentQ + 1;
    qText.innerText = q.q;
    optContainer.innerHTML = "";

    q.opts.forEach(opt => {
        const div = document.createElement("div");
        div.className = "option";
        div.innerText = opt.text;
        div.onclick = () => {
            Object.keys(opt.score).forEach(k => {
                score[k] += opt.score[k];
            });
            currentQ++;
            if(currentQ >= questions.length){
                showResult();
            } else {
                renderQuestion();
            }
        };
        optContainer.appendChild(div);
    });
}

// 计算4字母类型
function getDogType(){
    const ei = score.E >= score.I ? "E":"I";
    const sn = score.S >= score.N ? "S":"N";
    const tf = score.T >= score.F ? "T":"F";
    const jp = score.J >= score.P ? "J":"P";
    return ei+sn+tf+jp;
}

// 绘制海报Canvas
function drawPoster(item){
    ctx.fillStyle="#fffaf5";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="#222";
    ctx.font="bold 26px system-ui";
    ctx.textAlign="center";
    ctx.fillText("🐕 你的小狗人格", canvas.width/2, 50);

    ctx.font="70px system-ui";
    ctx.fillText(item.emoji, canvas.width/2, 125);

    ctx.font="bold 22px system-ui";
    ctx.fillText(item.name, canvas.width/2, 165);

    ctx.fillStyle="#666";
    ctx.font="15px system-ui";
    ctx.fillText(item.subtitle, canvas.width/2, 195);

    ctx.fillStyle="#333";
    ctx.textAlign="left";
    ctx.font="14px system-ui";
    let lineY = 230;
    const lineHeight = 22;
    const maxW = 320;
    const words = item.desc;
    let line = "";
    for(let char of words){
        if(ctx.measureText(line+char).width > maxW){
            ctx.fillText(line,20,lineY);
            lineY += lineHeight;
            line = char;
        }else{
            line += char;
        }
    }
    ctx.fillText(line,20,lineY);
    lineY += 35;

    ctx.fillStyle="#777";
    ctx.font="13px system-ui";
    ctx.textAlign="center";
    ctx.fillText("标签："+item.tags.join(" · "), canvas.width/2, lineY);
    ctx.fillText("来自：测测你是什么小狗测试", canvas.width/2, 440);
}

function showResult(){
    const type = getDogType();
    const res = resultList.find(r => r.key === type) || resultList[0];

    resEmoji.innerText = res.emoji;
    resName.innerText = res.name;
    resSub.innerText = res.subtitle;
    resDesc.innerText = res.desc;
    resTags.innerHTML = "";

    res.tags.forEach(t => {
        const span = document.createElement("span");
        span.className="tag";
        span.innerText = t;
        resTags.appendChild(span);
    });
    drawPoster(res);
    showPage("result");
}

function resetQuiz(){
    currentQ = 0;
    score = {E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
    showPage("quiz");
    renderQuestion();
}

startBtn.onclick = resetQuiz;
restartBtn.onclick = resetQuiz;

// 保存图片
saveImgBtn.onclick = ()=>{
    const link = document.createElement("a");
    link.download = "小狗人格海报.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
}

shareBtn.onclick = () => {
    navigator.clipboard.writeText(location.href).then(() => {
        alert("链接复制成功，发给朋友一起测！");
    });
};

showPage("start");
</script>
</body>
