.btn.secondary{background:#6c757d;}

.option{padding:16px 14px;border:1px solid #ddd;border-radius:10px;margin-bottom:12px;cursor:pointer;transition:0.15s;}
.option:hover{background:#f4f4f6;border-color:#aaa;}
.option:active{background:#ececf0;}

/* 结果页 */
#result-page{display:none;padding:30px 20px;min-height:100vh;max-width:420px;margin:0 auto;text-align:center;}
.result-img{width:140px;height:140px;margin:20px auto;border-radius:12px;background:#eee;display:flex;align-items:center;justify-content:center;font-size:60px;}
.result-title{font-size:24px;font-weight:bold;margin:12px 0 6px;}
.result-subtitle{color:#777;margin-bottom:24px;}
.result-desc{text-align:left;line-height:1.7;color:#444;margin-bottom:24px;}
.tags-wrap{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px;justify-content:center;}
.tag{background:#f0f0f4;padding:6px 12px;border-radius:20px;font-size:13px;color:#444;}
.canvas-box{margin:16px 0}
#shareCanvas{border-radius:12px;max-width:100%;box-shadow:0 2px 10px #00000015}

/* 结尾图片页面 */
#end-page{display:none;text-align:center;padding:40px 20px;min-height:100vh;max-width:420px;margin:0 auto;}
.end-tip{font-size:15px;color:#666;margin-bottom:30px;}
.end-img-wrap{margin:0 auto 30px;max-width:340px;}
.end-img-wrap img{width:100%;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,0.12);}

.hide{display:none !important;}
</style>

let currentQuestion = 0;

const quizPage = document.getElementById("quiz-page");
const resultPage = document.getElementById("result-page");
const endPage = document.getElementById("end-page");

const qText = document.getElementById("q-text");
const optContainer = document.getElementById("opt-container");
const currentNum = document.getElementById("current-num");
const totalNum = document.getElementById("total-num");

// 隐藏全部页面工具

    startPage.classList.add("hide");
    quizPage.classList.add("hide");
    resultPage.classList.add("hide");
    endPage.classList.add("hide");
}

// 开始答题
document.getElementById("startBtn").onclick = ()=>{
    hideAllPage();
    quizPage.style.display = "block";
    renderQuestion();
};

// 渲染题目
function renderQuestion(){
    const item = questions[currentQuestion];
    currentNum.innerText = currentQuestion+1;
    qText.innerText = item.q;
    optContainer.innerHTML = "";
    item.opts.forEach((opt,idx)=>{
        const div = document.createElement("div");
        div.className = "option";
        div.innerText = opt.text;
        div.onclick = ()=>{
            score.E += opt.score.E || 0;
            score.I += opt.score.I || 0;
            score.S += opt.score.S || 0;
            score.N += opt.score.N || 0;
            score.T += opt.score.T || 0;
            score.F += opt.score.F || 0;
            score.J += opt.score.J || 0;
            score.P += opt.score.P || 0;
            currentQuestion++;
            if(currentQuestion >= questions.length){
                calcResult();
                return;
            }
            renderQuestion();
        };
        optContainer.appendChild(div);
    });
}

// 计算MBTI类型，匹配小狗人格
function calcResult(){
    let type = "";
    type += score.E >= score.I ? "E" : "I";
    type += score.S >= score.N ? "S" : "N";
    type += score.T >= score.F ? "T" : "F";
    type += score.J >= score.P ? "J" : "P";
    const res = dogTypeList.find(item=>item.code===type);
    fillResult(res);
}

// 填充结果页面
function fillResult(data){
    hideAllPage();
    resultPage.style.display = "block";
    document.getElementById("res-emoji").innerText = data.emoji;
    document.getElementById("res-name").innerText = data.name;
    document.getElementById("res-sub").innerText = data.sub;
    document.getElementById("res-desc").innerText = data.desc;
    const tagWrap = document.getElementById("res-tags");
    tagWrap.innerHTML = "";
    data.tags.forEach(tag=>{
        const span = document.createElement("span");
        span.className = "tag";
        span.innerText = tag;
        tagWrap.appendChild(span);
    });
    drawPoster(data);
}

// 绘制海报画布
function drawPoster(data){
    const canvas = document.getElementById("shareCanvas");
    const ctx = canvas.getContext("2d");
    ctx.fillStyle="#f7f7f9";
    ctx.fillRect(0,0,360,480);
    ctx.fillStyle="#222";
    ctx.font="bold 26px sans-serif";
    ctx.fillText(data.name,40,120);
    ctx.font="16px sans-serif";
    ctx.fillStyle="#666";
    ctx.fillText(data.sub,40,150);
    ctx.font="15px sans-serif";
    ctx.fillStyle="#444";
    const textWrap = wrapText(data.desc, 280);
    textWrap.forEach((line,i)=>{
        ctx.fillText(line,40,200+i*22);
    });
}

// 文字自动换行工具
function wrapText(text,maxWidth){
    const canvas = document.getElementById("shareCanvas");
    const ctx = canvas.getContext("2d");
    const words = text.split("");
    let line = "";
    const lines = [];
    words.forEach(char=>{
        if(ctx.measureText(line+char).width>maxWidth){
            lines.push(line);
            line = char;
        }else{
            line += char;
        }
    });
    lines.push(line);
    return lines;
}

// 保存图片
document.getElementById("saveImgBtn").onclick = ()=>{
    const canvas = document.getElementById("shareCanvas");
    const a = document.createElement("a");
    a.href = canvas.toDataURL("image/png");
    a.download = "我的小狗人格.png";
    a.click();
};

// 重新测试
document.getElementById("restartBtn").onclick = ()=>{
    score = {E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
    currentQuestion = 0;
    hideAllPage();
    startPage.classList.remove("hide");
};

// 复制分享链接
document.getElementById("shareBtn").onclick = ()=>{
    navigator.clipboard.writeText(window.location.href);
    alert("链接已复制！");
}

// 跳转到结尾图片页
document.getElementById("goEndBtn").onclick = function(){
    hideAllPage();
    endPage.style.display="block";
}
// 从结尾页返回结果页
document.getElementById("backToResultBtn").onclick = function(){
    hideAllPage();
    resultPage.style.display="block";
}

}); // DOMContentLoaded结束
