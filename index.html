<!DOCTYPE html>

<body>

//页面加载完成后初始化
document.addEventListener('DOMContentLoaded', function(){
    startPage = document.getElementById("start-page");
    quizPage = document.getElementById("quiz-page");
    resultPage = document.getElementById("result-page");
    endPage = document.getElementById("end-page");

    qText = document.getElementById("q-text");
    optContainer = document.getElementById("opt-container");
    progressText = document.getElementById("current-num");

    //开始按钮
    document.getElementById("startBtn").onclick = function(){
        hideAllPage();
        quizPage.style.display = "block";
        currentQuestion = 0;
        score = {E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
        renderQuestion();
    };
    //重测按钮
    document.getElementById("restartBtn").onclick = function(){
        hideAllPage();
        startPage.style.display = "block";
    };
    //分享按钮
    document.getElementById("shareBtn").onclick = async function(){
        await navigator.clipboard.writeText(window.location.href);
        alert("链接已复制！");
    };
    //前往结尾页
    document.getElementById("goEndBtn").onclick = function(){
        hideAllPage();
        endPage.style.display = "block";
    };
    //从结尾返回结果页
    document.getElementById("backToResultBtn").onclick = function(){
        hideAllPage();
        resultPage.style.display = "block";
    };
});

//隐藏全部页面
function hideAllPage(){
    startPage.style.display = "none";
    quizPage.style.display = "none";
    resultPage.style.display = "none";
    endPage.style.display = "none";
}

//渲染题目
function renderQuestion(){
    const q = questions[currentQuestion];
    progressText.innerText = currentQuestion + 1;
    qText.innerText = q.q;
    optContainer.innerHTML = "";
    q.opts.forEach(opt=>{
        const btn = document.createElement("button");
        btn.innerText = opt.text;
        btn.onclick = function(){
            //累加分数
            for(let key in opt.score){
                score[key] += opt.score[key];
            }
            currentQuestion++;
            if(currentQuestion >= questions.length){
                showResult();
            }else{
                renderQuestion();
            }
        }
        optContainer.appendChild(btn);
    })
}

//计算结果并展示
function showResult(){
    hideAllPage();
    resultPage.style.display = "block";
    //计算四个维度
    const e = score.E, i = score.I;
    const s = score.S, n = score.N;
    const t = score.T, f = score.F;
    const j = score.J, p = score.P;
    let type = "";
    type += e>=i ? "E":"I";
    type += s>=n ? "S":"N";
    type += t>=f ? "T":"F";
    type += j>=p ? "J":"P";

    //匹配小狗信息
    const myDog = dogTypeList.find(item=>item.code === type);
    let html = "";
    if(myDog){
        html += `<div style="text-align:center">
        <div style="font-size:48px;">${myDog.emoji}</div>
        <h3>${myDog.name}</h3>
        <p>${myDog.sub}</p>
        <p style="margin:10px 0;">${myDog.desc}</p>
        <p>标签：${myDog.tags.join("、")}</p>
        <p>你的类型：${type}</p>
        </div>`;
    }else{
        html = `<p>匹配成功，类型：${type}</p>`;
    }
    document.getElementById("result-content").innerHTML = html;
}
