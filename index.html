    document.getElementById("backToResultBtn").onclick = function(){
        hideAllPage();
        resultPage.style.display = "block";
    };
});

//隐藏全部页面
function hideAllPage(){
    startPage.style.display = "none";
    quizPage.style.display = "none";
    resultPage.style.display = "none";
    endPage.style.display = "none";
}

//渲染题目
function renderQuestion(){
    const q = questions[currentQuestion];
    progressText.innerText = currentQuestion + 1;
    qText.innerText = q.q;
    optContainer.innerHTML = "";
    q.opts.forEach(opt=>{
        const btn = document.createElement("button");
        btn.innerText = opt.text;
        btn.onclick = function(){
            //累加分数
            for(let key in opt.score){
                score[key] += opt.score[key];
            }
            currentQuestion++;
            if(currentQuestion >= questions.length){
                showResult();
            }else{
                renderQuestion();
            }
        }
        optContainer.appendChild(btn);
    })
}

//计算结果并展示：【顶部小狗卡片 + 下方维度分析卡片】
function showResult(){
    hideAllPage();
    resultPage.style.display = "block";
    //四个维度分数
    const e = score.E, i = score.I;
    const s = score.S, n = score.N;
    const t = score.T, f = score.F;
    const j = score.J, p = score.P;
    let type = "";
    type += e>=i ? "E":"I";
    type += s>=n ? "S":"N";
    type += t>=f ? "T":"F";
    type += j>=p ? "J":"P";

    const myDog = dogTypeList.find(item=>item.code === type);
    let html = "";
    // 1. 顶部小狗人格卡片
    if(myDog){
        html += `<div class="result-card-top">
        <div class="avatar">${myDog.emoji}</div>
        <h2>${myDog.name}</h2>
        <p style="color:#666;font-size:18px;">${myDog.sub}</p>
        <p style="line-height:1.7;margin-top:12px;">${myDog.desc}</p>
        <div class="tags-wrap">
            ${myDog.tags.map(tag=>`<span class="tag">${tag}</span>`).join("")}
        </div>
        </div>`;
    }

    // 2. 第二张卡片：维度分析（不再重复人格）
    const totalE_I = e + i;
    const totalS_N = s + n;
    const totalT_F = t + f;
    const totalJ_P = j + p;
    html += `<div class="dimension-card">
    <h3 style="text-align:center;margin-bottom:16px;">性格维度分析</h3>
    <div class="dimension-item">
        <div class="dimension-name">
            <span>E外向</span>
            <span>I内向</span>
        </div>
        <div class="bar-bg">
            <div class="bar-fill" style="width:${totalE_I? (e/totalE_I*100):50}%"></div>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:13px;color:#666;margin-top:4px;">
            <span>${e}分</span><span>${i}分</span>
        </div>
    </div>
    <div class="dimension-item">
        <div class="dimension-name">
            <span>S实感</span>
            <span>N直觉</span>
        </div>
        <div class="bar-bg">
            <div class="bar-fill" style="width:${totalS_N? (s/totalS_N*100):50}%"></div>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:13px;color:#666;margin-top:4px;">
            <span>${s}分</span><span>${n}分</span>
        </div>
    </div>
    <div class="dimension-item">
        <div class="dimension-name">
            <span>T思考</span>
            <span>F情感</span>
        </div>
        <div class="bar-bg">
            <div class="bar-fill" style="width:${totalT_F? (t/totalT_F*100):50}%"></div>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:13px;color:#666;margin-top:4px;">
            <span>${t}分</span><span>${f}分</span>
        </div>
    </div>
    <div class="dimension-item">
        <div class="dimension-name">
            <span>J判断</span>
            <span>P感知</span>
        </div>
        <div class="bar-bg">
            <div class="bar-fill" style="width:${totalJ_P? (j/totalJ_P*100):50}%"></div>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:13px;color:#666;margin-top:4px;">
            <span>${j}分</span><span>${p}分</span>
        </div>
    </div>
    <p style="text-align:center;margin-top:12px;color:#666">你的人格代码：${type}</p>
    </div>`;

    document.getElementById("result-content").innerHTML = html;
}
</script>
</body>
</html>
